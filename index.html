<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Joining Guild Meeting...</title>
  <style>
    body { font-family: sans-serif; text-align: center; padding: 50px 20px; background: #1a1a1a; color: #fff; }
    .btn { display: inline-block; margin-top: 25px; padding: 20px 32px; font-size: 22px; font-weight: bold;
           background: #2e7d32; color: #fff; text-decoration: none; border-radius: 10px; }
    .tip { margin-top: 30px; font-size: 16px; color: #ddd; line-height: 1.5; }
  </style>
</head>
<body>
  <h2>Blacksmithing Guild Video Room</h2>
  <p>Tap the green button below to open the meeting in a separate browser window:</p>
  <a id="join-btn" class="btn" href="#" target="_blank" rel="noopener">Join Meeting in Browser</a>
  <p class="tip">To read PDFs during the meeting, switch back to your email app. If the meeting didn't open in a separate browser, tap <strong>⋮</strong> (top-right) and choose <strong>Open in Chrome</strong>.</p>

  <script>
    const targetUrl = "https://jitsi.riot.im/WesternCanadianBlacksmithsGuild#config.startWithAudioMuted=true&config.disableDeepLinking=true";
    const ua = navigator.userAgent || "";
    const isAndroid = /Android/i.test(ua);
    const isIOS = /iPhone|iPad|iPod/i.test(ua);
    const btn = document.getElementById("join-btn");

    if (isAndroid) {
      // Forces Android to launch standalone Chrome as a separate app window on tap
      btn.href = "googlechrome://navigate?url=" + encodeURIComponent(targetUrl);
    } else if (isIOS) {
      // Forces iOS to open standalone Safari on tap
      btn.href = targetUrl.replace(/^https:\/\//, "x-safari-https://");
    } else {
      // Desktop jumps immediately
      btn.href = targetUrl;
      window.location.replace(targetUrl);
    }
  </script>
</body>
</html>
