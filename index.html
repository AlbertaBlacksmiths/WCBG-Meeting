<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Joining Guild Meeting...</title>
  <style>
    body { font-family: sans-serif; text-align: center; padding: 50px 20px; background: #1a1a1a; color: #fff; }
    .btn { display: inline-block; margin-top: 25px; padding: 20px 32px; font-size: 22px; font-weight: bold;
           background: #2e7d32; color: #fff; text-decoration: none; border-radius: 10px; }
    .tip { margin-top: 30px; font-size: 15px; color: #bbb; line-height: 1.5; }
  </style>
</head>
<body>
  <h2>Blacksmithing Guild Video Room</h2>
  <p>Tap the green button below to open the meeting in your browser:</p>
  <a id="join-btn" class="btn" href="#">Join Meeting in Browser</a>
  <p class="tip">Still inside your email app? Tap the <strong>three dots (⋮)</strong> in the top-right corner and choose <strong>Open in Chrome</strong>.</p>

  <script>
    const targetUrl = "https://jitsi.riot.im/WesternCanadianBlacksmithsGuild#config.startWithAudioMuted=true&config.disableDeepLinking=true";
    const ua = navigator.userAgent || "";
    const isAndroid = /Android/i.test(ua);
    const isIOS = /iPhone|iPad|iPod/i.test(ua);
    const btn = document.getElementById("join-btn");

    if (isAndroid) {
      // Force full Chrome app outside the Gmail Custom Tab (no fallback URL so it doesn't stay embedded)
      const stripped = targetUrl.replace(/^https?:\/\//, "");
      const chromeIntent = "intent://" + stripped + "#Intent;scheme=https;package=com.android.chrome;end";
      btn.href = chromeIntent;
      window.location.href = chromeIntent;
    } else if (isIOS) {
      btn.href = targetUrl.replace(/^https:\/\//, "x-safari-https://");
    } else {
      btn.href = targetUrl;
      window.location.replace(targetUrl);
    }
  </script>
</body>
</html>
